name: Auto Deploy from Sheet

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger option

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SHEET_ID: ${{ secrets.SHEET_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch sheet data with curl
        run: |
          curl -s "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_ID }}/gviz/tq?tqx=out:csv&sheet=পত্রক1" > raw_sheet.csv
          echo "Sheet data fetched"
          wc -l raw_sheet.csv

      - name: Convert CSV to TSV for generate-site.py
        run: |
          # Convert CSV to TSV (handle commas in fields properly)
          python3 -c "
          import csv
          with open('raw_sheet.csv', 'r', encoding='utf-8') as f:
              reader = csv.reader(f)
              with open('raw_sheet.txt', 'w', encoding='utf-8', newline='') as out:
                  for row in reader:
                      out.write('\\t'.join(row) + '\\n')
          "
          head -5 raw_sheet.txt

      - name: Generate site
        run: |
          cd scripts
          python generate-site.py ../raw_sheet.txt
          cd ..

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "Gride X Auto Deploy"
          git config user.email "grideon@users.noreply.github.com"
          git commit -m "Auto update from sheet: $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.git-check.outputs.changes == 'true'
        run: |
          npm install -g wrangler
          wrangler pages deploy . --project-name gridexcentral --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
