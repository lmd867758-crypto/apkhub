name: Auto Deploy from Sheet

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger option

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SHEET_ID: ${{ secrets.SHEET_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch sheet data with curl
        run: |
          curl -s "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_ID }}/gviz/tq?tqx=out:csv" > raw_sheet.csv
          echo "Sheet data fetched"
          wc -l raw_sheet.csv
          head -3 raw_sheet.csv

      - name: Generate site
        run: |
          python scripts/generate-site.py raw_sheet.csv

      - name: Safety check — abort if site would go empty
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('data.json'))))")
          echo "Generated data.json with $COUNT apps"
          if [ "$COUNT" -lt 1 ]; then
            echo "❌ data.json has 0 apps — sheet fetch likely failed. Aborting before commit."
            exit 1
          fi

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
          # workflow_dispatch always deploys
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "Gride X Auto Deploy"
          git config user.email "grideon@users.noreply.github.com"
          git commit -m "Auto update from sheet: $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.git-check.outputs.changes == 'true'
        run: |
          npm install -g wrangler@latest
          wrangler pages deploy . --project-name gridexcentral --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
