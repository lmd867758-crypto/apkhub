<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="90">
  <defs>
    <style>
      @keyframes runCycle { 100% { transform: translateX(290px); } }
      @keyframes bounceBody { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes legLeft { 0%,100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
      @keyframes legRight { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(-20deg); } }
      @keyframes armLeft { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
      @keyframes armRight { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
      @keyframes blink { 0%,90%,100% { opacity:1; } 95% { opacity:0; } }
      @keyframes glow { 0%,100% { opacity:0.3; } 50% { opacity:0.6; } }
      @keyframes sparkle { 0%,100% { opacity:0; transform:scale(0); } 50% { opacity:1; transform:scale(1); } }
      @keyframes groundScroll { 0% { transform:translateX(0); } 100% { transform:translateX(-40px); } }
      .runner { animation: runCycle 3s linear infinite; }
      .body-group { animation: bounceBody 0.4s ease-in-out infinite; }
      .leg-l { transform-origin:32px 60px; animation: legLeft 0.25s ease-in-out infinite; }
      .leg-r { transform-origin:32px 60px; animation: legRight 0.25s ease-in-out infinite; }
      .arm-l { transform-origin:20px 32px; animation: armLeft 0.25s ease-in-out infinite; }
      .arm-r { transform-origin:44px 32px; animation: armRight 0.25s ease-in-out infinite; }
      .eye { animation: blink 2.5s infinite; }
      .glow-bg { animation: glow 2s ease-in-out infinite; }
      .ground { animation: groundScroll 0.8s linear infinite; }
    </style>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="5" width="340" height="80" rx="16" fill="#12122a" stroke="rgba(108,92,231,0.2)" stroke-width="1"/>

  <!-- Glow behind character -->
  <circle cx="42" cy="45" r="25" fill="#6c5ce7" opacity="0.15" class="glow-bg"/>

  <!-- Running character -->
  <g class="runner">
    <g class="body-group">
      <!-- Shadow -->
      <ellipse cx="32" cy="75" rx="18" ry="4" fill="rgba(0,0,0,0.3)"/>

      <!-- Hair (anime style) -->
      <path d="M20 14 Q24 6 32 6 Q40 6 44 14 L44 12 Q40 4 32 4 Q24 4 20 12Z" fill="#6c5ce7"/>
      <path d="M18 16 Q16 10 22 8" fill="#5a4bd1"/>
      <path d="M46 16 Q48 10 42 8" fill="#5a4bd1"/>

      <!-- Head -->
      <circle cx="32" cy="20" r="10" fill="#ffd5b8"/>

      <!-- Eyes (anime style) -->
      <g class="eye">
        <ellipse cx="27" cy="19" rx="3.5" ry="4" fill="#fff"/>
        <circle cx="27" cy="19" r="2" fill="#2d2d5e"/>
        <circle cx="28" cy="18" r="0.8" fill="#fff"/>
      </g>
      <g class="eye">
        <ellipse cx="37" cy="19" rx="3.5" ry="4" fill="#fff"/>
        <circle cx="37" cy="19" r="2" fill="#2d2d5e"/>
        <circle cx="38" cy="18" r="0.8" fill="#fff"/>
      </g>

      <!-- Mouth (smile) -->
      <path d="M29 25 Q32 28 35 25" stroke="#e8a88a" fill="none" stroke-width="1.2"/>

      <!-- Body / Shirt -->
      <rect x="22" y="30" width="20" height="22" rx="4" fill="#6c5ce7"/>
      <!-- Collar -->
      <path d="M27 30 L32 34 L37 30" fill="none" stroke="#5a4bd1" stroke-width="1.5"/>

      <!-- Arms -->
      <g class="arm-l">
        <rect x="10" y="32" width="12" height="5" rx="2.5" fill="#ffd5b8"/>
      </g>
      <g class="arm-r">
        <rect x="42" y="32" width="12" height="5" rx="2.5" fill="#ffd5b8"/>
      </g>

      <!-- Shorts -->
      <rect x="23" y="50" width="18" height="8" rx="2" fill="#2d2d5e"/>

      <!-- Legs -->
      <g class="leg-l">
        <rect x="20" y="54" width="7" height="18" rx="3" fill="#2d2d5e"/>
        <rect x="18" y="70" width="11" height="5" rx="2" fill="#333"/>
      </g>
      <g class="leg-r">
        <rect x="29" y="54" width="7" height="18" rx="3" fill="#2d2d5e"/>
        <rect x="27" y="70" width="11" height="5" rx="2" fill="#333"/>
      </g>
    </g>
  </g>

  <!-- Ground lines -->
  <g class="ground" opacity="0.3">
    <line x1="80" y1="78" x2="110" y2="78" stroke="#6c5ce7" stroke-width="1.5"/>
    <line x1="130" y1="78" x2="160" y2="78" stroke="#6c5ce7" stroke-width="1.5"/>
    <line x1="180" y1="78" x2="210" y2="78" stroke="#6c5ce7" stroke-width="1.5"/>
  </g>

  <!-- Speed lines -->
  <g opacity="0.4">
    <line x1="55" y1="25" x2="75" y2="25" stroke="#6c5ce7" stroke-width="1" stroke-linecap="round"/>
    <line x1="55" y1="40" x2="80" y2="40" stroke="#6c5ce7" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="70" y2="55" stroke="#6c5ce7" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Ad text -->
  <text x="100" y="35" font-family="Arial" font-weight="800" font-size="15" fill="#fff">⚡ Mod APK Zone</text>
  <text x="100" y="52" font-family="Arial" font-size="11" fill="#8888bb">Click here for latest mods &amp; updates!</text>

  <!-- AD badge -->
  <rect x="275" y="12" width="55" height="22" rx="6" fill="#6c5ce7"/>
  <text x="302" y="27" font-family="Arial" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">📢 AD</text>

  <!-- CTA Button -->
  <rect x="260" y="45" width="70" height="28" rx="8" fill="url(#ctaGrad)" opacity="0.9"/>
  <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6c5ce7"/>
    <stop offset="100%" stop-color="#8b7cf7"/>
  </linearGradient>
  <text x="295" y="63" font-family="Arial" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">Download</text>

  <!-- Sparkles -->
  <circle cx="80" cy="15" r="1.5" fill="#fdcb6e" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="65" r="1" fill="#fdcb6e" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="245" cy="18" r="1.5" fill="#74b9ff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>