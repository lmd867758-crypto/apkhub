<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <style>
      @keyframes run { 100% { transform: translateX(260px); } }
      @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes legL { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
      @keyframes legR { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
      @keyframes armL { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } }
      @keyframes armR { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
      .char { animation: run 2s linear infinite; }
      .body { animation: bounce 0.5s ease-in-out infinite; }
      .leg-l { transform-origin: 30px 55px; animation: legL 0.3s ease-in-out infinite; }
      .leg-r { transform-origin: 30px 55px; animation: legR 0.3s ease-in-out infinite; }
      .arm-l { transform-origin: 25px 30px; animation: armL 0.3s ease-in-out infinite; }
      .arm-r { transform-origin: 35px 30px; animation: armR 0.3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="300" height="80" rx="12" fill="linear-gradient(135deg,#1a1a3e,#0d0d24)" opacity="0"/>
  <g class="char">
    <g class="body">
      <!-- Head -->
      <circle cx="20" cy="18" r="8" fill="#ffd5b8"/>
      <circle cx="16" cy="16" r="1.5" fill="#333"/>
      <circle cx="24" cy="16" r="1.5" fill="#333"/>
      <path d="M17 22 Q20 25 23 22" stroke="#333" fill="none" stroke-width="1"/>
      <!-- Hair -->
      <path d="M12 14 Q20 8 28 14" fill="#6c5ce7" stroke="none"/>
      <path d="M10 18 Q8 12 15 10" fill="#6c5ce7"/>
      <path d="M30 18 Q32 12 25 10" fill="#6c5ce7"/>
      <!-- Body -->
      <rect x="14" y="26" width="12" height="18" rx="3" fill="#6c5ce7"/>
      <rect x="16" y="28" width="8" height="6" rx="1" fill="#fff" opacity="0.3"/>
      <!-- Arms -->
      <g class="arm-l"><rect x="6" y="28" width="8" height="4" rx="2" fill="#ffd5b8"/></g>
      <g class="arm-r"><rect x="26" y="28" width="8" height="4" rx="2" fill="#ffd5b8"/></g>
      <!-- Legs -->
      <g class="leg-l"><rect x="15" y="44" width="5" height="14" rx="2" fill="#2d2d5e"/><rect x="14" y="56" width="7" height="4" rx="2" fill="#333"/></g>
      <g class="leg-r"><rect x="20" y="44" width="5" height="14" rx="2" fill="#2d2d5e"/><rect x="19" y="56" width="7" height="4" rx="2" fill="#333"/></g>
    </g>
  </g>
  <text x="100" y="35" font-family="Arial" font-weight="bold" font-size="14" fill="#fff">⚡ Fast Downloads</text>
  <text x="100" y="55" font-family="Arial" font-size="11" fill="#8888bb">Anime Runner - Click here!</text>
  <rect x="240" y="25" width="50" height="30" rx="8" fill="linear-gradient(135deg,#6c5ce7,#8b7cf7)" opacity="0"/>
  <text x="248" y="44" font-family="Arial" font-weight="bold" font-size="10" fill="#fff">AD</text>
</svg>